name: KMISS load test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL del ambiente QA sin barra final
        required: true
        type: string

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Execute two critical endpoints
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          mkdir -p load/results
          k6 run --summary-export load/results/summary.json load/kmiss-load.js 2>&1 | tee load/results/console.txt

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-evidence-${{ github.run_number }}
          path: load/results
          if-no-files-found: error
