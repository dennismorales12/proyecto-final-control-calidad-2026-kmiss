name: KMISS - Validacion de calidad y despliegue

on:
  pull_request:
    branches: [DEV, QA, main]
  push:
    branches: [DEV, QA, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validacion_calidad:
    name: Compilacion, pruebas y analisis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Preparar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci --prefix backend

      - name: Instalar dependencias del frontend
        run: npm ci --include=dev --prefix frontend

      - name: Compilar aplicacion web
        run: npm run build --prefix frontend

      - name: Ejecutar pruebas unitarias y cobertura
        run: npm test --prefix backend -- --runInBand --silent --coverage --collectCoverageFrom=src/**/*.js --coverageReporters=text --coverageReporters=lcov

      - name: Analizar codigo con SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verificar puerta de calidad de SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Ejecutar pruebas de API contra QA
        if: ${{ env.QA_BASE_URL != '' }}
        env:
          QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
          QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
        run: >-
          npx --yes newman@6.2.1 run postman/KMISS.postman_collection.json
          --env-var baseUrl="$QA_BASE_URL"
          --env-var adminEmail="$QA_ADMIN_EMAIL"
          --env-var adminPassword="$QA_ADMIN_PASSWORD"
          --reporters cli,junit
          --reporter-junit-export test-results/newman.xml

      - name: Publicar evidencias de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.run_number }}
          path: |
            backend/coverage
            test-results
          if-no-files-found: warn

      - name: Desplegar aplicacion en produccion
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && env.RENDER_DEPLOY_HOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

