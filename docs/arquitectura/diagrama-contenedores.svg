  <defs><style>.title{font:700 30px Arial;fill:#111}.h{font:700 21px Arial;fill:#fff}.t{font:16px Arial;fill:#222}.s{font:14px Arial;fill:#555}.b{fill:#eef5fb;stroke:#1f4e78;stroke-width:3}.dark{fill:#1f4e78;stroke:#173b5c;stroke-width:3}.db{fill:#fff8e8;stroke:#c59a45;stroke-width:3}.ext{fill:#f4f4f4;stroke:#666;stroke-width:2}.line{stroke:#555;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
