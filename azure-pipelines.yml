name: KMISS_$(Date:yyyyMMdd)_$(Rev:r)

trigger:
  branches:
    include:
      - DEV
      - QA
      - main

pr:
  branches:
    include:
      - DEV
      - QA
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: KMISS - Ambientes
  - name: versionNode
    value: '20.x'
  - name: archivoAplicacion
    value: '$(Build.ArtifactStagingDirectory)/kmiss-$(Build.BuildId).zip'

stages:
  - stage: Compilacion
    displayName: Compilar aplicación
    jobs:
      - job: PrepararAplicacion
        displayName: Preparar backend y frontend
        steps:
          - checkout: self
            displayName: Descargar código fuente

          - task: NodeTool@0
            displayName: Preparar Node.js 20
            inputs:
              versionSpec: $(versionNode)

          - script: npm ci --prefix backend
            displayName: Instalar dependencias del backend

          - script: npm ci --include=dev --prefix frontend
            displayName: Instalar dependencias del frontend

          - script: npm run build --prefix frontend
            displayName: Compilar aplicación web

          - task: CopyFiles@2
            displayName: Preparar archivos para despliegue
            inputs:
              SourceFolder: $(Build.SourcesDirectory)
              Contents: |
                **/*
                !**/.git/**
                !**/node_modules/**
                !backend/coverage/**
              TargetFolder: $(Build.ArtifactStagingDirectory)/paquete

          - script: npm ci --omit=dev --prefix "$(Build.ArtifactStagingDirectory)/paquete/backend"
            displayName: Incluir dependencias productivas del backend

          - task: ArchiveFiles@2
            displayName: Empaquetar aplicación
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/paquete
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(archivoAplicacion)
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: Publicar paquete de la aplicación
            inputs:
              targetPath: $(archivoAplicacion)
              artifact: aplicacion-kmiss

  - stage: PruebasUnitarias
    displayName: Ejecutar pruebas unitarias
    dependsOn: Compilacion
    jobs:
      - job: PruebasBackend
        displayName: Pruebas de backend y frontend
        steps:
          - checkout: self
            displayName: Descargar código fuente

          - task: NodeTool@0
            displayName: Preparar Node.js 20
            inputs:
              versionSpec: $(versionNode)

          - script: npm ci --prefix backend
            displayName: Instalar dependencias de pruebas del backend

          - script: npm ci --prefix frontend
            displayName: Instalar dependencias de pruebas del frontend

          - script: >-
              npm test --prefix backend --
              --runInBand
              --coverage
              --collectCoverageFrom=src/**/*.js
              --coverageReporters=text
              --coverageReporters=lcov
              --coverageReporters=cobertura
            displayName: Ejecutar pruebas y calcular cobertura

          - script: npm test --prefix frontend --if-present
            displayName: Ejecutar pruebas unitarias del frontend

          - task: PublishCodeCoverageResults@2
            displayName: Publicar cobertura
            inputs:
              summaryFileLocation: $(Build.SourcesDirectory)/backend/coverage/cobertura-coverage.xml

          - task: PublishPipelineArtifact@1
            displayName: Conservar evidencia de cobertura
            condition: always()
            inputs:
              targetPath: $(Build.SourcesDirectory)/backend/coverage
              artifact: cobertura-backend

  - stage: AnalisisEstatico
    displayName: Analizar calidad del código
    dependsOn: PruebasUnitarias
    jobs:
      - job: SonarCloud
        displayName: SonarCloud y puerta de calidad
        steps:
          - checkout: self
            displayName: Descargar código fuente
            fetchDepth: 0

          - task: DownloadPipelineArtifact@2
            displayName: Recuperar cobertura del backend
            inputs:
              artifactName: cobertura-backend
              targetPath: $(Build.SourcesDirectory)/backend/coverage

          - task: SonarCloudPrepare@3.4.3
            displayName: Preparar análisis de SonarCloud
            inputs:
              SonarCloud: SonarCloud KMISS
              organization: $(SONAR_ORGANIZATION)
              scannerMode: cli
              configMode: file

          - task: SonarCloudAnalyze@3.4.3
            displayName: Ejecutar análisis estático

          - task: SonarCloudPublish@3.4.3
            displayName: Verificar puerta de calidad
            inputs:
              pollingTimeoutSec: '300'

  - stage: PruebasApi
    displayName: Ejecutar pruebas de API
    dependsOn: AnalisisEstatico
    jobs:
      - job: Newman
        displayName: Validar el candidato de KMISS
        services:
          postgres:
            image: postgres:16-alpine
            ports:
              - 5432:5432
            env:
              POSTGRES_DB: kmiss_ci
              POSTGRES_USER: postgres
              POSTGRES_HOST_AUTH_METHOD: trust
        steps:
          - checkout: self
            displayName: Descargar colección Postman

          - task: NodeTool@0
            displayName: Preparar Node.js 20
            inputs:
              versionSpec: $(versionNode)

          - script: |
              echo "##vso[task.setvariable variable=JWT_CI;issecret=true]$(openssl rand -hex 32)"
            displayName: Generar secreto temporal de integración

          - script: |
              npm ci --prefix backend
              npm run init-db --prefix backend
              npm run seed --prefix backend
            displayName: Preparar API y base temporal
            env:
              DATABASE_URL: postgresql://postgres@localhost:5432/kmiss_ci
              DEMO_PASSWORD: $(CLAVE_PRUEBAS_API)
              JWT_SECRET: $(JWT_CI)
              NODE_ENV: test

          - script: |
              nohup npm start --prefix backend > "$(Agent.TempDirectory)/kmiss-api.log" 2>&1 &
              for intento in {1..30}; do
                if curl --fail --silent http://127.0.0.1:4000/health > /dev/null; then
                  exit 0
                fi
                sleep 2
              done
              cat "$(Agent.TempDirectory)/kmiss-api.log"
              exit 1
            displayName: Iniciar candidato y verificar disponibilidad
            env:
              DATABASE_URL: postgresql://postgres@localhost:5432/kmiss_ci
              DEMO_PASSWORD: $(CLAVE_PRUEBAS_API)
              JWT_SECRET: $(JWT_CI)
              NODE_ENV: test

          - script: |
              mkdir -p "$(Agent.TempDirectory)/newman"
              npm install --prefix "$(Agent.TempDirectory)/newman-cli" --ignore-scripts newman@6.2.1
              "$(Agent.TempDirectory)/newman-cli/node_modules/.bin/newman" run postman/KMISS.postman_collection.json \
                --env-var "baseUrl=http://127.0.0.1:4000" \
                --env-var "adminEmail=$(USUARIO_PRUEBAS_API)" \
                --env-var "adminPassword=$(CLAVE_PRUEBAS_API)" \
                --reporters cli,junit \
                --reporter-junit-export "$(Agent.TempDirectory)/newman/resultados.xml"
            displayName: Ejecutar colección con Newman

          - task: PublishPipelineArtifact@1
            displayName: Conservar bitácora de la API candidata
            condition: always()
            inputs:
              targetPath: $(Agent.TempDirectory)/kmiss-api.log
              artifact: bitacora-api-candidata

          - task: PublishTestResults@2
            displayName: Publicar resultados de API
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Agent.TempDirectory)/newman/resultados.xml
              testRunTitle: Pruebas de API KMISS

  - stage: Despliegue
    displayName: Desplegar ambiente correspondiente
    dependsOn: PruebasApi
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: Desarrollo
        displayName: Desplegar en Desarrollo
        condition: eq(variables['Build.SourceBranch'], 'refs/heads/DEV')
        environment: KMISS - Desarrollo
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: Publicar aplicación de Desarrollo
                  inputs:
                    azureSubscription: Conexión Azure KMISS
                    appType: webAppLinux
                    appName: $(AZURE_WEBAPP_DEV)
                    package: $(Pipeline.Workspace)/aplicacion-kmiss/*.zip
                    startUpCommand: npm run azure-start

      - deployment: Calidad
        displayName: Desplegar en Calidad
        condition: eq(variables['Build.SourceBranch'], 'refs/heads/QA')
        environment: KMISS - Calidad
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: Publicar aplicación de Calidad
                  inputs:
                    azureSubscription: Conexión Azure KMISS
                    appType: webAppLinux
                    appName: $(AZURE_WEBAPP_QA)
                    package: $(Pipeline.Workspace)/aplicacion-kmiss/*.zip
                    startUpCommand: npm run azure-start

      - deployment: Produccion
        displayName: Desplegar en Producción
        condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
        environment: KMISS - Producción
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: Publicar aplicación de Producción
                  inputs:
                    azureSubscription: Conexión Azure KMISS
                    appType: webAppLinux
                    appName: $(AZURE_WEBAPP_PROD)
                    package: $(Pipeline.Workspace)/aplicacion-kmiss/*.zip
                    startUpCommand: npm start
